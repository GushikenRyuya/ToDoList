<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふたりのタスク">
<meta name="format-detection" content="telephone=no">
<title>ふたりのタスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f8; --surface:#ffffff; --ink:#1b2438; --sub:#6b7488; --line:#dde3ec;
  --accent:#0f8b8d; --accent-ink:#ffffff; --danger:#c8453b; --done:#a2abbb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141a26; --surface:#1d2536; --ink:#e8edf6; --sub:#939db3; --line:#2c3650;
    --accent:#3cb8ba; --accent-ink:#0c1a1b; --danger:#ef7b71; --done:#667089;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.55;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body.sorting{user-select:none; -webkit-user-select:none}
.wrap{max-width:640px; margin:0 auto; padding:14px 12px 96px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
h1{font-size:1.3rem; margin:0; letter-spacing:.02em}
.status{font-size:.8rem; color:var(--sub); display:flex; align-items:center; gap:6px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--done)}
.dot.on{background:var(--accent)}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.btn{border:1px solid var(--line); background:var(--surface); border-radius:12px; min-height:44px; padding:0 16px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.btn.ghost{border:none; background:none; color:var(--sub); min-width:44px; padding:0 8px}
.btn:active{filter:brightness(.93)}
@media (hover:hover){ .btn:hover{border-color:var(--accent)} .btn.ghost:hover{color:var(--danger)} }

input[type=text], textarea{
  font:inherit; font-size:16px; color:inherit; background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:10px 12px; width:100%; min-height:44px;
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent)}

.add-list{display:flex; gap:8px; margin-bottom:22px}
.add-list input{flex:1; min-width:0}

.list{margin-bottom:28px; padding-left:10px; border-left:4px solid var(--accent)}
.list.dragging{background:var(--surface); box-shadow:0 8px 22px rgba(0,0,0,.22); border-radius:0 12px 12px 0; position:relative; z-index:2}
.sorting-lists .tasks, .sorting-lists .add-task{display:none}
.sorting-lists .list{margin-bottom:10px}
.list-head{display:flex; align-items:center; gap:4px; margin-bottom:4px}
.list-head .handle{width:34px; flex:none; margin-left:-6px}
.list-title{
  flex:1; min-width:0; font-size:1.15rem; font-weight:700; background:transparent;
  border:1px solid transparent; padding:6px 8px; margin-left:-8px;
}
.count{font-size:.8rem; color:var(--sub); white-space:nowrap}

.task{display:grid; grid-template-columns:34px 30px 1fr 44px; column-gap:2px; align-items:start;
  padding:4px 0; border-bottom:1px solid var(--line); background:var(--bg)}
.handle{
  grid-column:1; grid-row:1; height:44px; display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:22px; line-height:1; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
}
.task input[type=checkbox]{
  grid-column:2; grid-row:1;
  appearance:none; -webkit-appearance:none; width:26px; height:26px; margin:9px 0 0;
  border:2px solid var(--sub); border-radius:8px; background:var(--surface); cursor:pointer; position:relative;
}
.task input[type=checkbox]:checked{background:var(--accent); border-color:var(--accent)}
.task input[type=checkbox]:checked::after{
  content:""; position:absolute; left:7px; top:2px; width:6px; height:12px;
  border:solid var(--accent-ink); border-width:0 3px 3px 0; transform:rotate(45deg);
}
.task .text{grid-column:3; grid-row:1; background:transparent; border-color:transparent; font-weight:500; padding:10px 8px}
.task .note{
  grid-column:3 / 5; grid-row:2; background:transparent; border-color:transparent; color:var(--sub);
  padding:6px 8px; margin-bottom:4px; resize:none; overflow:hidden; min-height:38px;
}
.task .text::placeholder, .task .note::placeholder{color:var(--done)}
.task .del{grid-column:4; grid-row:1}
.task.done .text{color:var(--done); text-decoration:line-through}
.task.done .note{color:var(--done)}
.task.dragging{background:var(--surface); box-shadow:0 8px 22px rgba(0,0,0,.22); border-radius:12px; position:relative; z-index:2}
@media (hover:hover){ .task .text:hover, .task .note:hover, .list-title:hover{border-color:var(--line); background:var(--surface)} }

.add-task{display:flex; gap:8px; margin-top:10px}
.add-task input{flex:1; min-width:0}
.empty{color:var(--sub); text-align:center; padding:40px 8px}

.gate{max-width:420px; margin:12vh auto 0; padding:0 20px}
.gate p{color:var(--sub); font-size:.9rem}
.err{color:var(--danger); font-size:.9rem; margin-top:10px; word-break:break-all}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 18px; border-radius:22px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  function show(msg){
    var r=document.getElementById("root");
    if(r && !r.children.length){
      r.innerHTML='<div class="gate"><h1>表示できませんでした</h1><p></p></div>';
      r.querySelector("p").textContent=msg;
    }
  }
  window.addEventListener("error",function(e){ setTimeout(function(){show("エラー: "+e.message+"(firebase-config.js が正しいか確認してください)")},0); });
  setTimeout(function(){show("読み込みに失敗しました。firebase-config.js が配置され、正しい内容か確認してください。")},4000);
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch, deleteField, FieldPath
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const root = document.getElementById("root");
const toastEl = document.getElementById("toast");

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"), 2200); }
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}

// ---- 設定チェック ----
if (!firebaseConfig || String(firebaseConfig.apiKey).startsWith("YOUR_")){
  root.append(el("div", {class:"gate"},
    el("h1", {}, "設定がまだです"),
    el("p", {}, "firebase-config.js に Firebase の設定を貼り付けてください。手順は README.md にあります。")));
  throw new Error("firebase-config.js is not configured");
}

// ---- 保存先(固定) ----
const room = "main";

// ---- Firestore ----
const app = initializeApp(firebaseConfig);
let db;
try{
  // 端末に保存して起動を速くし、通信が不安定でも入力できるようにする
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}catch(e){ db = getFirestore(app); }
const listsCol = collection(db, "rooms", room, "lists");
const listRef = id => doc(db, "rooms", room, "lists", id);

let lists = [];
let online = false;
let loaded = false;
let pendingRender = false;
let dragging = false;
const migrating = new Set();

const tid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const orderOf = l => typeof l.order === "number" ? l.order : (l.createdAt || 0);
function normTasks(l){
  const t = l.tasks;
  if (!t) return [];
  if (Array.isArray(t)) return t.map((x, i) => ({ ...x, id: x.id || ("old" + i), order: i }));
  return Object.entries(t)
    .filter(([, x]) => x && typeof x.text === "string" && typeof x.order === "number")
    .map(([id, x]) => ({ id, ...x }))
    .sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));
}
const safe = p => Promise.resolve(p).catch(e => { console.error(e); toast("保存できませんでした。通信を確認してください"); });
const tp = (taskId, f) => f ? new FieldPath("tasks", taskId, f) : new FieldPath("tasks", taskId);

// 書き込みは端末側に即反映され(待ち時間なし)、あとから通信で同期される
const addList = title => {
  const order = lists.length ? Math.max(...lists.map(orderOf)) + 1 : 0;
  return safe(setDoc(listRef(tid()), { title, tasks: {}, createdAt: Date.now(), order }));
};
const renameList = (id, title) => safe(updateDoc(listRef(id), { title }));
const removeList = id => safe(deleteDoc(listRef(id)));
const reorderLists = order => {
  const batch = writeBatch(db);
  order.forEach((id, i) => batch.update(listRef(id), { order: i }));
  return safe(batch.commit());
};
const addTask = (listId, text) => {
  const l = lists.find(x => x.id === listId);
  const max = l ? Math.max(-1, ...normTasks(l).map(t => t.order)) : -1;
  return safe(updateDoc(listRef(listId), tp(tid()), { text, note: "", done: false, order: max + 1 }));
};
const patchTask = (listId, taskId, patch) =>
  safe(updateDoc(listRef(listId), ...Object.entries(patch).flatMap(([k, v]) => [tp(taskId, k), v])));
const removeTask = (listId, taskId) => safe(updateDoc(listRef(listId), tp(taskId), deleteField()));
const reorderTasks = (listId, order) =>
  safe(updateDoc(listRef(listId), ...order.flatMap((id, i) => [tp(id, "order"), i])));

// 旧形式(配列)のデータを新形式へ一度だけ変換
function migrate(l){
  const obj = {};
  (l.tasks || []).forEach((t, i) => { obj[tid() + i] = { text: t.text || "", note: t.note || "", done: !!t.done, order: i }; });
  safe(updateDoc(listRef(l.id), { tasks: obj }));
}

render();

onSnapshot(listsCol, snap => {
  if (snap.metadata.fromCache && snap.empty && !loaded){ online = false; render(); return; }
  loaded = true;
  online = !snap.metadata.fromCache;
  lists = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => orderOf(a) - orderOf(b));
  for (const l of lists) if (Array.isArray(l.tasks) && !migrating.has(l.id)){ migrating.add(l.id); migrate(l); }
  render();
}, err => {
  console.error(err);
  root.replaceChildren(el("div", {class:"gate"}, el("h1", {}, "読み込めません"),
    el("p", {}, "Firestore のルール設定か、firebase-config.js を確認してください。"), el("div", {class:"err"}, String(err.message))));
});

// ---- 並べ替え(ハンドルをドラッグ) ----
function autoScroll(y){
  const m = 90;
  if (y < m) window.scrollBy(0, -14);
  else if (y > window.innerHeight - m) window.scrollBy(0, 14);
}
function enableSort(handle, row, box, opts){
  handle.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    dragging = true;
    document.body.classList.add("sorting");
    if (opts.collapse){
      // リスト移動中は中身をたたんで、指の位置がずれないようスクロールを補正
      const y0 = handle.getBoundingClientRect().top;
      document.body.classList.add("sorting-lists");
      window.scrollBy(0, handle.getBoundingClientRect().top - y0);
    }
    row.classList.add("dragging");
    try{ handle.setPointerCapture(e.pointerId); }catch{}
    const before = [...box.children].map(r => r.dataset.id).join();

    const onMove = ev => {
      autoScroll(ev.clientY);
      const others = [...box.children].filter(r => r !== row);
      const next = others.find(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (next){ if (row.nextElementSibling !== next) box.insertBefore(row, next); }
      else if (box.lastElementChild !== row) box.append(row);
    };
    const onEnd = () => {
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onEnd);
      handle.removeEventListener("pointercancel", onEnd);
      dragging = false;
      document.body.classList.remove("sorting", "sorting-lists");
      row.classList.remove("dragging");
      const order = [...box.children].map(r => r.dataset.id);
      if (order.join() === before){ if (pendingRender) render(); return; }
      opts.commit(order);
    };
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onEnd);
    handle.addEventListener("pointercancel", onEnd);
  });
}

// ---- 描画 ----
function isEditing(){
  const a = document.activeElement;
  if (!a || !root.contains(a) || a.dataset.addFor) return false;
  return (a.tagName === "INPUT" && a.type === "text") || a.tagName === "TEXTAREA";
}
root.addEventListener("focusout", () => { setTimeout(() => { if (pendingRender && !isEditing() && !dragging) render(); }, 0); });

function autosize(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }

function render(){
  if (dragging || isEditing()){ pendingRender = true; return; }
  pendingRender = false;

  // 追加欄は入力中の文字とフォーカスを描画後も引き継ぐ
  const act = document.activeElement;
  const keep = act && act.dataset && act.dataset.addFor
    ? { id: act.dataset.addFor, value: act.value } : null;
  const scrollY = window.scrollY;
  const notes = [];

  const newTitle = el("input", {type:"text", "data-add-for":"__new", enterkeyhint:"done", placeholder:"新しいリスト名(例: 買い物)"});
  const submitList = () => { const v = newTitle.value.trim(); if (!v) return; addList(v); newTitle.value = ""; };
  newTitle.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) submitList(); });

  const wrap = el("div", {class:"wrap"},
    el("header", {},
      el("h1", {}, "ふたりのタスク"),
      el("div", {class:"status"},
        el("span", {class:"dot" + (online ? " on" : "")}),
        online ? "同期中" : "接続中…")),
    el("div", {class:"add-list"}, newTitle, el("button", {class:"btn primary", onclick:submitList}, "リスト追加")));

  if (!loaded) wrap.append(el("div", {class:"empty"}, "読み込み中…(10秒以上続く場合は Firestore の設定を確認してください)"));
  else if (!lists.length) wrap.append(el("div", {class:"empty"}, "まだリストがありません。上の欄からひとつ作ってみましょう。"));

  const listsBox = el("div", {class:"lists"});
  for (const l of (loaded ? lists : [])){
    const tasks = normTasks(l);
    const doneN = tasks.filter(t => t.done).length;

    const listHandle = el("div", {class:"handle", role:"button", "aria-label":"ドラッグしてリストを並べ替え", title:"ドラッグしてリストを並べ替え"}, "≡");

    const title = el("input", {type:"text", class:"list-title", value:l.title, "aria-label":"リスト名"});
    title.addEventListener("change", () => { const v = title.value.trim(); if (v) renameList(l.id, v); else title.value = l.title; });
    title.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) title.blur(); });

    const section = el("section", {class:"list", "data-id":l.id},
      el("div", {class:"list-head"}, listHandle, title,
        el("span", {class:"count"}, `${doneN}/${tasks.length}`),
        el("button", {class:"btn ghost", "aria-label":"リストを削除", onclick: () => {
          if (confirm(`「${l.title}」とその中のタスクをすべて削除しますか?`)) removeList(l.id);
        }}, "削除")));
    enableSort(listHandle, section, listsBox, { collapse:true, commit: reorderLists });

    const box = el("div", {class:"tasks"});
    for (const t of tasks){
      const handle = el("div", {class:"handle", role:"button", "aria-label":"ドラッグして並べ替え", title:"ドラッグして並べ替え"}, "≡");

      const cb = el("input", {type:"checkbox", checked:!!t.done, "aria-label":"完了"});
      cb.addEventListener("change", () => patchTask(l.id, t.id, { done: cb.checked }));

      const text = el("input", {type:"text", class:"text", value:t.text, placeholder:"タスク内容", "aria-label":"タスク内容"});
      text.addEventListener("change", () => patchTask(l.id, t.id, { text: text.value.trim() }));
      text.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) text.blur(); });

      const note = el("textarea", {class:"note", rows:1, placeholder:"備考", "aria-label":"備考"});
      note.value = t.note || "";
      note.addEventListener("input", () => autosize(note));
      note.addEventListener("change", () => patchTask(l.id, t.id, { note: note.value }));
      notes.push(note);

      const del = el("button", {class:"btn ghost del", "aria-label":"タスクを削除", onclick: () => {
        if (confirm("このタスクを削除しますか?")) removeTask(l.id, t.id);
      }}, "✕");

      const row = el("div", {class:"task" + (t.done ? " done" : ""), "data-id":t.id}, handle, cb, text, del, note);
      enableSort(handle, row, box, { commit: order => reorderTasks(l.id, order) });
      box.append(row);
    }
    section.append(box);

    const addInput = el("input", {type:"text", "data-add-for":l.id, enterkeyhint:"done", placeholder:"タスクを追加"});
    const submitTask = () => { const v = addInput.value.trim(); if (!v) return; addTask(l.id, v); addInput.value = ""; };
    addInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) submitTask(); });
    section.append(el("div", {class:"add-task"}, addInput, el("button", {class:"btn", onclick:submitTask}, "追加")));
    listsBox.append(section);
  }
  wrap.append(listsBox);

  root.replaceChildren(wrap);
  notes.forEach(autosize);
  window.scrollTo(0, scrollY);   // 再描画で画面が上に飛ばないようにする
  if (keep){
    const target = root.querySelector(`[data-add-for="${CSS.escape(keep.id)}"]`);
    if (target){ target.value = keep.value; target.focus({ preventScroll:true }); }
  }
}
</script>
</body>
</html>
